# loop-gate policy — https://github.com/cobusgreyling/loop-engineering
#
# `npx @cobusgreyling/loop gate check --action merge --paths <csv>` exits
# 0 = allowed, 2 = escalate to a human.
#
# The pipeline is /loop-triage -> /loop-pick -> /loop-plan -> /loop-build ->
# /loop-verify -> /loop-ship, and .github/workflows/loop.yml runs the same steps
# from the Actions tab. `--action merge` is used there, not `auto-merge`: the
# latter also demands a non-empty autoMergeAllowlist, which this repo keeps empty.
version: 1

denylist:
  - "**/*.env"
  - "**/.env*"
  # Tooling that runs agents unattended.
  - "opencode.json"
  - "gate.yaml"
  - "loop-constraints.md"
  - ".agents/skills/**"
  - ".github/**"

autoMergeAllowlist:
  # Empty on purpose: the verifier approves, a human merges. An empty YAML value
  # parses as null, which loop-gate rejects, so the list must be explicit.
  []

maxFiles: 12
